name: Build Native Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android Project
        run: |
          # Создаем структуру папок классического Android-приложения
          mkdir -p app/src/main/java/com/diogenes/userswitcher
          mkdir -p app/src/main/res/values
          
          # 1. Создаем build.gradle для сборки
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 2. Создаем настройки проекта settings.gradle
          echo "include ':app'" > settings.gradle

          # 3. Создаем конфигурацию модуля app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.diogenes.userswitcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.diogenes.userswitcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

                    # 4. Создаем Манифест приложения с правильным Интентом (Исправлено)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application android:label="Смена пользователя" android:allowBackup="true" android:supportsRtl="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoDisplay">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF


          # 5. Пишем нативный Java-код запуска меню
          cat << 'EOF' > app/src/main/java/com/diogenes/userswitcher/MainActivity.java
          package com.diogenes.userswitcher;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.Bundle(savedInstanceState);
                  try {
                      // Нативный и самый мощный способ вызова меню настроек пользователей
                      Intent intent = new Intent("android.settings.USER_SETTINGS");
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Ошибка запуска меню", Toast.LENGTH_SHORT).show();
                  }
                  // Мгновенно закрываемся, чтобы приложение не висело в памяти
                  finish();
              }
          }
          EOF

          # 6. Скачиваем официальный установщик Gradle (Gradle Wrapper)
          gradle wrapper --gradle-version 8.5

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: UserSwitcher-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
