<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>User Switcher Launcher</title>
    <script>
        // Резервный таймер: если Cordova зависла, через 0.3 секунды пробуем открыть напрямую
        var fallbackTimeout = setTimeout(function() {
            launchDirectly();
        }, 300);

        document.addEventListener('deviceready', onDeviceReady, false);

        function onDeviceReady() {
            clearTimeout(fallbackTimeout); // Cordova отозвалась, отменяем резервный таймер
            
            if (window.plugins && window.plugins.launcher) {
                window.plugins.launcher.launch({
                    action: "android.settings.USER_SETTINGS"
                }, function() {
                    closeApp();
                }, function() {
                    launchDirectly(); // Если плагин выдал ошибку, пробуем прямой метод
                });
            } else {
                launchDirectly();
            }
        }

        function launchDirectly() {
            // Прямой вызов системного интента через браузерный редирект Android
            window.location.href = "intent:#Intent;action=android.settings.USER_SETTINGS;end";
            setTimeout(closeApp, 400);
        }

        function closeApp() {
            if (navigator.app && navigator.app.exitApp) {
                navigator.app.exitApp();
            } else {
                window.close();
            }
        }
    </script>
</head>
<body style="background-color: #121212;">
    <!-- Небольшой визуальный индикатор, чтобы экран не казался зависшим -->
    <div style="color: #ffffff; text-align: center; margin-top: 50%; font-family: sans-serif;">
        Запуск настроек...
    </div>
</body>
</html>
